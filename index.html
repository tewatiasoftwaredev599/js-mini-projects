<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JavaScript Mini Projects</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; margin-bottom: 40px; text-align: center; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; text-align: center; text-decoration: none; color: #fff; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); background: #1e293bcc; }
        .card h2 { font-size: 1.3rem; margin-bottom: 10px; color: #f8fafc; }
        .card span { font-size: 0.9rem; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🚀 My JavaScript Mini Projects</h1>
    <p>Click any project below to view it live:</p>

    <div class="grid">
        <a href="counter.html" class="card">
            <h2>🔢 Counter App</h2>
            <span>Open Project ➔</span>
        </a>
        <a href="login.html" class="card">
            <h2>🔐 Login Form</h2>
            <span>Open Project ➔</span>
        </a>
        <a href="product.html" class="card">
            <h2>🛍️ Product Search</h2>
            <span>Open Project ➔</span>
        </a>
        <a href="search.html" class="card">
            <h2>🔍 Search Bar</h2>
            <span>Open Project ➔</span>
        </a>
    </div>

</body>
</html>
